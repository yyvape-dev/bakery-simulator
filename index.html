<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f4dbb4"><title>こもれびベーカリー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6e8cc;color:#5a3c26;font-family:system-ui,-apple-system,sans-serif;height:100dvh;display:flex;flex-direction:column}header{padding:calc(env(safe-area-inset-top) + 8px) 12px 9px;background:#fff8e9;display:flex;align-items:center;justify-content:space-between;font-weight:bold;gap:8px}header span{background:#efddb9;padding:5px 9px;border-radius:14px;font-size:12px}h1{font-size:16px;margin:0}#modeBanner{background:#6c8b69;color:white;text-align:center;padding:9px 12px;font-size:14px;font-weight:800;min-height:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}#modeBanner.moving{background:#d18838}#modeBanner.erasing{background:#b75d51}#modeBanner.selected{background:#bc8e37}canvas{min-height:0;flex:1;width:100%;touch-action:none;background:linear-gradient(#d4eac7,#fff0d2)}section#management{background:#e9f0db;padding:8px 10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:11px;text-align:center}#management b{display:block;font-size:15px}#management div{background:#fffaf1;border:1px solid #dbcaac;border-radius:8px;padding:5px 2px}#simactions{display:flex;gap:5px;padding:5px 8px;background:#e9f0db}#simactions button{flex:1;background:#d9eacb}footer{background:#fff8e9;padding:9px 7px calc(env(safe-area-inset-bottom) + 9px)}.items,.actions{display:flex;gap:5px;overflow-x:auto;padding-bottom:7px}button{flex-shrink:0;border:2px solid #cfa977;background:#fff7e8;border-radius:10px;padding:9px 10px;font-weight:bold;color:#5a3c26;font-size:12px}button.active{background:#d6aa6f}.actions button{flex:1;padding:10px 2px}small{display:block;text-align:center;min-height:15px}#toast{position:fixed;top:13%;left:50%;transform:translateX(-50%);background:white;padding:8px;border-radius:12px;border:1px solid #b58b61;display:none;z-index:3;pointer-events:none}
</style>
<header><h1>🥐 こもれびベーカリー</h1><span id="coins">🪙 5000</span><span id="count">設備 0</span></header>
<div id="modeBanner" role="status" aria-live="polite">設置モード｜パン棚</div><canvas id="game"></canvas><section id="management"><div>営業時間<b id="clock">09:00</b></div><div>生産中<b id="baking">なし</b></div><div>棚在庫<b id="stock">0 / 12</b></div><div>本日売上<b id="sales">0</b></div></section><div id="simactions"><button id="start">▶ 開店</button><button id="make">🥐 仕込み (原価30)</button><button id="restock">📦 補充</button><button id="close">締め</button></div><div id="toast"></div>
<footer><div id="items" class="items"></div><div class="actions"><button id="rotate">↻ 回転</button><button id="move">移動</button><button id="erase">撤去</button><button id="cancel">✕ 解除</button><button id="minus">－</button><button id="plus">＋</button><button id="reset">初期化</button></div><small id="hint">家具を選び、床をタップして設置</small></footer>
<script>
(()=>{'use strict';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),N=10;
const furniture={shelf:['パン棚','🥖',2,1,250,'#e6ac67'],oven:['オーブン','🔥',2,2,650,'#c97957'],register:['レジ','💰',2,1,350,'#9bbbab'],prep:['調理台','🥣',2,2,480,'#d0b57f'],table:['テーブル','☕',2,2,220,'#c79c75'],plant:['植木','🌱',1,1,80,'#8abc81']};
let state={coins:5000,objects:[],type:'shelf',rot:0,zoom:1,mode:'idle',selection:null};
try{const old=JSON.parse(localStorage.getItem('bakery_web_v1'));if(old&&Array.isArray(old.objects))Object.assign(state,old,{selection:null,mode:'idle'});}catch{}
let g={},hover=null,pointer=null,drag=null;const furnitureImages={};for(const type of Object.keys(furniture)){const im=new Image();im.onload=()=>{furnitureImages[type]=im;render()};im.src='assets/'+type+'.webp'}const furnitureViews={},furnitureGeometry={"imageSize":[512,512],"anchorPixels":[256.0002136230469,389.38427734375],"tileXAxisPixels":[86.19967651367188,46.54780578613281]};for(const type of Object.keys(furniture)){furnitureViews[type]=[];for(let rot=0;rot<4;rot++){const im=new Image();im.onload=()=>{furnitureViews[type][rot]=im;render()};im.src='assets/'+type+'_r'+rot+'.webp'}};let sim={open:false,minute:540,bake:0,ready:0,stock:0,sales:0,sold:0,customers:0,customerTick:0,day:1};let actor={x:3,y:7,tx:3,ty:7},visitor={x:5,y:9,tx:5,ty:9,active:false};
const store=()=>localStorage.setItem('bakery_web_v1',JSON.stringify({...state,selection:null,mode:'place'}));
const dims=o=>{const t=furniture[o.type];return o.rot%2?[t[3],t[2]]:[t[2],t[3]]};
const occupied=(objs=state.objects)=>{const m=new Map();for(const o of objs){const [w,h]=dims(o);for(let x=o.x;x<o.x+w;x++)for(let y=o.y;y<o.y+h;y++)m.set(x+','+y,o.id)}return m};
function accessible(objs){const busy=occupied(objs),q=[],seen=new Set();for(let x=0;x<N;x++){const k=x+',9';if(!busy.has(k)){q.push([x,9]);seen.add(k);break}}if(!q.length)return false;for(let i=0;i<q.length;i++){const [x,y]=q[i];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy,k=a+','+b;if(a>=0&&b>=0&&a<N&&b<N&&!busy.has(k)&&!seen.has(k)){seen.add(k);q.push([a,b])}}}return seen.size===N*N-busy.size}
function error(o,ignore){const [w,h]=dims(o);if(o.x<0||o.y<0||o.x+w>N||o.y+h>N)return '店舗の外です';const occ=occupied();for(let x=o.x;x<o.x+w;x++)for(let y=o.y;y<o.y+h;y++){let id=occ.get(x+','+y);if(id!==undefined&&id!==ignore)return 'ほかの設備と重なります'}if(!accessible([...state.objects.filter(p=>p.id!==ignore),o]))return '通路が分断されます';return ''}
const point=(x,y)=>({x:g.cx+(x-y)*g.tx,y:g.cy+(x+y)*g.ty});
const tile=(x,y)=>{const a=(x-g.cx)/g.tx,b=(y-g.cy)/g.ty,i=Math.floor((a+b)/2),j=Math.floor((b-a)/2);return i>=0&&j>=0&&i<N&&j<N?{x:i,y:j}:null};
function poly(v,fill,stroke){c.beginPath();v.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath();c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.stroke()}}
// Rendering and hit testing use the same sprite bounds and unmodified image alpha.
const imageMasks=new WeakMap();
function masks(im){if(imageMasks.has(im))return imageMasks.get(im);const layer=document.createElement('canvas');layer.width=im.naturalWidth;layer.height=im.naturalHeight;const ctx=layer.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);const data=ctx.getImageData(0,0,layer.width,layer.height).data,alpha=new Uint8Array(layer.width*layer.height);for(let i=0;i<alpha.length;i++)alpha[i]=data[i*4+3];ctx.clearRect(0,0,layer.width,layer.height);for(const [dx,dy] of [[-6,0],[6,0],[0,-6],[0,6],[-4,-4],[-4,4],[4,-4],[4,4]])ctx.drawImage(im,dx,dy);ctx.globalCompositeOperation='destination-out';ctx.drawImage(im,0,0);ctx.globalCompositeOperation='source-in';ctx.fillStyle='#ffda44';ctx.fillRect(0,0,layer.width,layer.height);const value={alpha,outline:layer};imageMasks.set(im,value);return value}
function sprite(o){const [ww,hh]=dims(o),p=point(o.x+ww/2,o.y+hh/2),directional=furnitureViews[o.type]?.[o.rot%4],im=directional||furnitureImages[o.type];if(!im)return null;if(directional){const scale=g.tx/furnitureGeometry.tileXAxisPixels[0],anchor=furnitureGeometry.anchorPixels;return{im,x:p.x-anchor[0]*scale,y:p.y-anchor[1]*scale,w:im.naturalWidth*scale,h:im.naturalHeight*scale,mirror:false}}const scale=Math.min(g.tx*(ww+hh)*.9/im.naturalWidth,g.ty*(ww+hh)*2.6/im.naturalHeight),w=im.naturalWidth*scale,h=im.naturalHeight*scale;return{im,x:p.x-w/2,y:p.y+g.ty*(ww+hh)*.42-h,w,h,mirror:o.rot===1||o.rot===2}}
const depth=o=>o.x+o.y+dims(o).reduce((a,b)=>a+b)/2;
const footprint=o=>{const [w,h]=dims(o);return[point(o.x,o.y),point(o.x+w,o.y),point(o.x+w,o.y+h),point(o.x,o.y+h)]};
function hitTest(p){for(const o of [...state.objects].sort((a,b)=>depth(a)-depth(b)).reverse()){const sp=sprite(o);if(sp){let u=(p.x-sp.x)/sp.w,v=(p.y-sp.y)/sp.h;if(u<0||u>=1||v<0||v>=1)continue;if(sp.mirror)u=1-u;const x=Math.min(sp.im.naturalWidth-1,Math.floor(u*sp.im.naturalWidth)),y=Math.floor(v*sp.im.naturalHeight);if(masks(sp.im).alpha[y*sp.im.naturalWidth+x]>=24)return o}else{const [w,h]=dims(o),q=point(o.x+w/2,o.y+h/2),size=Math.max(14,g.tx*.86);if(Math.abs(p.x-q.x)<=size/2&&Math.abs(p.y-(q.y-g.ty*.9))<=size/2)return o}}return null}
function drawFurniture(o,selected=false){const [ww,hh]=dims(o),p=point(o.x+ww/2,o.y+hh/2),foot=footprint(o),sp=sprite(o);c.save();c.globalAlpha=.15;poly(foot,'#634830');c.restore();c.save();if(sp){const paint=(im,dx=0,dy=0)=>{c.save();if(sp.mirror){c.translate(sp.x+sp.w+dx,sp.y+dy);c.scale(-1,1);c.drawImage(im,0,0,sp.w,sp.h)}else c.drawImage(im,sp.x+dx,sp.y+dy,sp.w,sp.h);c.restore()};if(selected){paint(masks(sp.im).outline)}c.globalAlpha=selected?.55:1;paint(sp.im)}else{c.globalAlpha=selected?.55:1;c.font=Math.max(14,g.tx*.86)+'px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(furniture[o.type][1],p.x,p.y-g.ty*.9)}c.restore();if(selected&&!drag){poly(foot,'#ffda4418','#ffda44');c.textAlign='center';c.textBaseline='top';c.font='bold '+Math.max(10,g.tx*.37)+'px sans-serif';c.fillStyle='#523a2c';c.fillText('✓ '+furniture[o.type][0]+' · '+(o.rot%4)*90+'°',p.x,foot[2].y+3)}}
function render(){const box=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),w=box.width,h=box.height;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);c.setTransform(dpr,0,0,dpr,0,0);g={tx:Math.min(w/21,h/13.4)*state.zoom,ty:0,cx:w/2,cy:Math.max(35,h*.13)};g.ty=g.tx*.54;
for(let k=0;k<2*N-1;k++)for(let x=0;x<N;x++){const y=k-x;if(y<0||y>=N)continue;poly([point(x,y),point(x+1,y),point(x+1,y+1),point(x,y+1)],(x+y)%2?'#f4dcb6':'#f9e5c2','#dfc095')}
if(drag){c.save();c.globalAlpha=.25;poly(footprint(drag.original),'#ffda44','#bd923b');c.restore();c.save();c.globalAlpha=.38;poly(footprint(drag.next),drag.reason?'#ed5b60':'#4aa981');c.restore()}
// Preserve floor depth except for the furniture currently held by the player.
const scene=state.objects.filter(o=>!drag||o.id!==drag.original.id).map(o=>({kind:'furniture',o,depth:depth(o)}));scene.push({kind:'person',who:actor,emoji:'👩‍🍳',depth:actor.x+actor.y+1});if(visitor.active)scene.push({kind:'person',who:visitor,emoji:'🐱',depth:visitor.x+visitor.y+1});scene.sort((a,b)=>a.depth-b.depth);
for(const item of scene){if(item.kind==='furniture'){drawFurniture(item.o,state.selection===item.o.id);continue}const p=point(item.who.x+.5,item.who.y+.5);c.font=Math.max(17,g.tx*.95)+'px sans-serif';c.textAlign='center';c.textBaseline='bottom';c.fillText(item.emoji,p.x,p.y+2)}
if(drag){drawFurniture(drag.visual,true);const foot=footprint(drag.next),[ww,hh]=dims(drag.next),p=point(drag.next.x+ww/2,drag.next.y+hh/2);poly(foot,'#ffffff08',drag.reason?'#c44343':'#25875a');c.textAlign='center';c.textBaseline='top';c.font='bold 11px sans-serif';c.fillStyle=drag.reason?'#9e2929':'#1f6948';c.fillText(drag.reason?'× 設置不可':'✓ 設置可',p.x,foot[2].y+4)}else if(hover&&state.mode==='place'){const test={type:state.type,rot:state.rot,...hover};c.save();c.globalAlpha=.37;poly(footprint(test),error(test)?'#ed5b60':'#4aa981');c.restore()}
c.textAlign='center';c.font='bold 12px sans-serif';c.fillStyle='#704e38';c.fillText('↓ 入口',w/2,Math.min(h-10,g.cy+20*g.ty+23))}
function flash(msg){const e=document.querySelector('#toast');e.textContent=msg;e.style.display='block';clearTimeout(flash.t);flash.t=setTimeout(()=>e.style.display='none',1800)}
function update(){syncSim();const banner=document.querySelector('#modeBanner'),selected=state.objects.find(o=>o.id===state.selection);banner.className=drag||state.mode==='move'?'moving':state.mode==='erase'?'erasing':selected?'selected':'';banner.textContent=drag?'移動中｜'+furniture[drag.original.type][0]+' · '+(drag.reason||'指を離して設置'):state.mode==='move'?'移動｜選んだ家具をつかんでドラッグ':state.mode==='erase'?'撤去中｜撤去する家具の本体をタップ':selected?'選択中｜'+furniture[selected.type][0]+' · そのままドラッグで移動':state.mode==='idle'?'待機中｜家具をタップして選択・ドラッグで移動':'設置モード｜'+furniture[state.type][0];document.querySelector('#move').classList.toggle('active',state.mode==='move');document.querySelector('#erase').classList.toggle('active',state.mode==='erase');document.querySelector('#coins').textContent='🪙 '+state.coins.toLocaleString();document.querySelector('#count').textContent='設備 '+state.objects.length;document.querySelector('#hint').textContent=drag?(drag.reason?'設置不可：'+drag.reason:'指を離すと設置できます'):state.mode==='move'?'家具本体をつかんで動かしてください':state.mode==='erase'?'家具本体をタップして撤去':selected?'選択中：ドラッグで移動・回転・撤去':state.mode==='idle'?'家具本体をタップ・そのままドラッグで移動':'家具を選び、空き床をタップして設置';document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===state.type&&state.mode==='place'));render()}
function selectCell(p){if(!p)return;const o={id:Math.max(0,...state.objects.map(x=>x.id))+1,type:state.type,...p,rot:state.rot},t=furniture[state.type];if(state.coins<t[4])return flash('資金不足');const err=error(o);if(err)return flash(err);state.coins-=t[4];state.objects.push(o);state.selection=null;state.mode='idle';store();update()}
function tapAt(p){const o=hitTest(p);if(state.mode==='erase'){if(!o)return;state.coins+=Math.floor(furniture[o.type][4]/2);state.objects=state.objects.filter(x=>x.id!==o.id);state.selection=null;store();return update()}if(o){state.selection=o.id;state.rot=o.rot;state.mode='idle';return update()}if(state.mode==='place')return selectCell(tile(p.x,p.y));if(state.mode==='move')return flash('選んだ家具の本体をつかんで動かしてください');state.selection=null;update()}
for(const [id,t] of Object.entries(furniture)){const b=document.createElement('button');b.dataset.type=id;b.textContent=t[1]+' '+t[0]+' '+t[4];b.onclick=()=>{state.type=id;state.rot=0;state.selection=null;state.mode='place';update()};document.querySelector('#items').append(b)}
document.querySelector('#rotate').onclick=()=>{if(state.selection!==null){const o=state.objects.find(x=>x.id===state.selection),next={...o,rot:(o.rot+1)%4},err=error(next,o.id);if(err)flash(err);else{Object.assign(o,next);store()}}else state.rot=(state.rot+1)%4;update()};
document.querySelector('#move').onclick=()=>{if(state.selection===null)return flash('移動する家具をタップして選択してください');state.mode='move';update()};
document.querySelector('#erase').onclick=()=>{state.mode='erase';state.selection=null;update()};document.querySelector('#cancel').onclick=()=>{cancelGesture();state.mode='idle';state.selection=null;hover=null;update()};
document.querySelector('#plus').onclick=()=>{state.zoom=Math.min(1.55,state.zoom+.12);update()};
document.querySelector('#minus').onclick=()=>{state.zoom=Math.max(.65,state.zoom-.12);update()};
document.querySelector('#reset').onclick=()=>{if(confirm('店舗を初期化しますか？')){state.objects=[];state.coins=5000;state.selection=null;state.mode='idle';state.zoom=1;store();update()}};
function loc(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function releaseGesture(){const held=pointer;pointer=null;drag=null;hover=null;canvas.style.cursor='default';if(held&&canvas.hasPointerCapture(held.id))canvas.releasePointerCapture(held.id)}
function cancelGesture(){if(!pointer&&!drag)return;releaseGesture();if(state.mode==='move')state.mode='idle';update()}
function previewAt(p){const dx=p.x-pointer.start.x,dy=p.y-pointer.start.y,a=dx/pointer.tx,b=dy/pointer.ty,x=(a+b)/2,y=(b-a)/2;drag.visual={...drag.original,x:drag.original.x+x,y:drag.original.y+y};drag.next={...drag.original,x:drag.original.x+Math.round(x),y:drag.original.y+Math.round(y)};drag.reason=error(drag.next,drag.original.id);update()}
canvas.addEventListener('pointerdown',e=>{if(pointer||!e.isPrimary||e.button!==0)return;const p=loc(e),o=hitTest(p);pointer={id:e.pointerId,start:p,tx:g.tx,ty:g.ty,object:o?{...o}:null,moved:false};canvas.setPointerCapture(e.pointerId);if(o&&state.mode!=='erase'){state.selection=o.id;state.rot=o.rot;state.mode='idle';update()}});
canvas.addEventListener('pointermove',e=>{const p=loc(e);if(!pointer){hover=tile(p.x,p.y);canvas.style.cursor=hitTest(p)?'grab':'default';return render()}if(e.pointerId!==pointer.id)return;const distance=Math.hypot(p.x-pointer.start.x,p.y-pointer.start.y);if(distance>=10)pointer.moved=true;if(pointer.moved&&pointer.object&&state.mode!=='erase'){if(!drag){drag={original:pointer.object,next:pointer.object,visual:pointer.object,reason:''};state.mode='move';hover=null;canvas.style.cursor='grabbing'}previewAt(p)}else if(!pointer.object){hover=tile(p.x,p.y);render()}});
canvas.addEventListener('pointerup',e=>{if(!pointer||e.pointerId!==pointer.id)return;const p=loc(e),moved=pointer.moved||Math.hypot(p.x-pointer.start.x,p.y-pointer.start.y)>=10;if(drag){previewAt(p);const next=drag.next,reason=drag.reason,id=drag.original.id;releaseGesture();state.mode='idle';if(reason){flash(reason+'。元の位置に戻しました')}else{const o=state.objects.find(o=>o.id===id);if(o){const changed=o.x!==next.x||o.y!==next.y;Object.assign(o,next);if(changed)store()}}return update()}releaseGesture();if(!moved)tapAt(p);else update()});
canvas.addEventListener('pointercancel',e=>{if(pointer&&e.pointerId===pointer.id)cancelGesture()});canvas.addEventListener('lostpointercapture',e=>{if(pointer&&e.pointerId===pointer.id)cancelGesture()});window.addEventListener('blur',cancelGesture);document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelGesture()});
// A second finger cannot rotate, purchase or remove equipment during a held gesture.
document.addEventListener('click',e=>{const button=e.target.closest('button');if(pointer&&button&&button.id!=='cancel'){e.preventDefault();e.stopImmediatePropagation()}},true);
function syncSim(){const hh=String(Math.floor(sim.minute/60)).padStart(2,'0'),mm=String(sim.minute%60).padStart(2,'0');document.querySelector('#clock').textContent='Day '+sim.day+' '+hh+':'+mm;document.querySelector('#baking').textContent=sim.bake>0?'残り '+sim.bake+'分':sim.ready+'個完成';document.querySelector('#stock').textContent=sim.stock+' / 12';document.querySelector('#sales').textContent=sim.sales.toLocaleString()+'円';document.querySelector('#start').textContent=sim.open?'⏸ 一時停止':'▶ 開店';}
function has(type){return state.objects.some(o=>o.type===type)}
function reachable(target){const busy=occupied(),queue=[[5,9]],seen=new Set(['5,9']);if(busy.has('5,9'))return false;for(let i=0;i<queue.length;i++){const [x,y]=queue[i];if(Math.abs(x-target.x)+Math.abs(y-target.y)<=1)return true;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy,k=a+','+b;if(a>=0&&b>=0&&a<10&&b<10&&!busy.has(k)&&!seen.has(k)){seen.add(k);queue.push([a,b])}}}return false}
function service(type){return state.objects.some(o=>o.type===type&&reachable(o))}
document.querySelector('#start').onclick=()=>{if(!sim.open){if(!service('oven')||!service('shelf')||!service('register'))return flash('オーブン・パン棚・レジを通行できる位置に設置してください');if(sim.minute>=1080)return flash('本日の営業は終了しました');}sim.open=!sim.open;syncSim()};
document.querySelector('#make').onclick=()=>{if(!service('oven')||!service('prep'))return flash('オーブンと調理台が必要です');if(sim.bake)return flash('製造中です');if(!sim.open&&sim.ready+sim.stock>=15)return flash('開店前の仕込み上限は15個です');if(state.coins<30)return flash('材料費が足りません');state.coins-=30;if(sim.open){sim.bake=25}else{sim.ready+=5;flash('開店前にパン5個を焼き上げました')}actor.tx=2;actor.ty=2;store();update()};
document.querySelector('#restock').onclick=()=>{if(!service('shelf'))return flash('パン棚がありません');const n=Math.min(12-sim.stock,sim.ready);if(n<1)return flash('補充するパンがありません');sim.stock+=n;sim.ready-=n;actor.tx=5;actor.ty=3;update()};
document.querySelector('#close').onclick=()=>{sim.open=false;flash('Day '+sim.day+' 売上 '+sim.sales+'円 / 販売 '+sim.sold+'個');sim.day++;sim.minute=540;sim.sales=0;sim.sold=0;sim.customerTick=0;visitor.active=false;update()};
function step(){if(!sim.open)return;sim.minute=Math.min(1080,sim.minute+1);if(sim.bake>0&&--sim.bake===0){sim.ready+=5;flash('パンが5個焼けました！')}sim.customerTick++;if(sim.customerTick>=12){sim.customerTick=0;sim.customers++;visitor.active=true;visitor.x=5;visitor.y=9;visitor.tx=5;visitor.ty=5;if(sim.stock>0&&service('register')&&service('shelf')){sim.stock--;sim.sold++;sim.sales+=120;state.coins+=120;store()}else flash('お客さん：パンが売り切れです')}if(sim.minute>=1080){sim.open=false;flash('閉店時間です。締めを押してください')}syncSim();update()}
function walk(){for(const person of [actor,visitor]){person.x+=(person.tx-person.x)*.06;person.y+=(person.ty-person.y)*.06}if(visitor.active&&Math.abs(visitor.y-visitor.ty)<.06){visitor.tx=5;visitor.ty=9;if(Math.abs(visitor.y-9)<.1)visitor.active=false}render()}
setInterval(step,350);setInterval(walk,75);window.addEventListener('resize',()=>{cancelGesture();render()});update();
})();
</script></html>
