function drawCharacter(a){const sp=characterSprite(a),p=point(a.x+.5,a.y+.5);c.save();c.fillStyle='#63483030';c.beginPath();c.ellipse(p.x,p.y,g.tx*.30,g.ty*.20,0,0,Math.PI*2);c.fill();if(sp)c.drawImage(sp.im,sp.frame*256,sp.dir*256,256,256,sp.x,sp.y,sp.w,sp.h);else{c.font=Math.max(17,g.tx*.95)+'px sans-serif';c.textAlign='center';c.fillText(a.id==='owner'?'👩‍🍳':'🐶',p.x,p.y)}if(a.job){c.textAlign='center';c.font=Math.max(9,g.tx*.55)+'px sans-serif';c.fillText(a.job.raw?'🥣':a.job.carry?'🥖':({supply:'📦',produce:'🥣',collect:'🔥',stock:'🥖',checkout:'🪙'}[a.job.type]),p.x+g.tx*.45,p.y-g.ty)}c.restore()}
function hitCharacter(p){const front=hitTest(p);for(const a of [...(crew?.staff||[])].sort((a,b)=>b.x+b.y-a.x-a.y)){if(front&&depth(front)>a.x+a.y+1)continue;const sp=characterSprite(a);if(!sp)continue;const u=(p.x-sp.x)/sp.w,v=(p.y-sp.y)/sp.h;if(u<0||u>=1||v<0||v>=1)continue;const ix=sp.frame*256+Math.floor(u*256),iy=sp.dir*256+Math.floor(v*256);if(masks(sp.im).alpha[iy*sp.im.naturalWidth+ix]>=24)return a}return null}
function paintStaff(){if(!crew)return;const a=crew.staff.find(a=>a.id===crew.selected);document.querySelector('#staffStatus').textContent=a.name+'：'+a.status+(a.command?' ／ 次：'+crew.labels[a.command]:'');if(document.activeElement!==document.querySelector('#staffRole'))document.querySelector('#staffRole').value=a.role;for(const k of ['Height','Width','Scale']){const input=document.querySelector('#look'+k),v=a.look[k.toLowerCase()];if(document.activeElement!==input)input.value=v;document.querySelector('#'+k.toLowerCase()+'Value').textContent=Math.round(v*100)+'%'}document.querySelectorAll('[data-staff]').forEach(b=>b.classList.toggle('active',b.dataset.staff===a.id))}
function showStaff(id=crew.selected){cancelGesture();state.selection=null;state.mode='idle';crew.selected=id;paintStaff();const d=document.querySelector('#staffDialog');if(!d.open)d.showModal();update()}
document.querySelector('#team').onclick=()=>showStaff();document.querySelector('#closeStaff').onclick=()=>document.querySelector('#staffDialog').close();document.querySelectorAll('[data-staff]').forEach(b=>b.onclick=()=>{crew.selected=b.dataset.staff;paintStaff()});document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{if(sim.phase==='ended')return flash('締めて翌日に進んでください');crew.command(crew.selected,b.dataset.job);paintStaff();update()});document.querySelector('#staffRole').onchange=e=>{crew.setRole(crew.selected,e.target.value);paintStaff()};for(const k of ['Height','Width','Scale'])document.querySelector('#look'+k).oninput=e=>{crew.setLook(crew.selected,k.toLowerCase(),e.target.value);paintStaff();render()};
crew=makeCrew(savedGame?.staff);crew.reconcile();
setInterval(step,350);setInterval(walk,75);window.addEventListener('resize',()=>{cancelGesture();render()});reconcileCustomer();update();
})();
</script></html>
