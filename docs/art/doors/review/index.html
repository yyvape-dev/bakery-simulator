<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4方向の扉｜こもれびベーカリー</title><style>body{font:16px/1.7 system-ui;background:#f0ead9;color:#514631;max-width:1200px;margin:auto;padding:20px}h1{font-size:25px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}figure{margin:0;background:#e2e1c6;border-radius:12px;overflow:hidden}canvas{width:100%;display:block}figcaption{text-align:center;padding:8px}a{color:#526e49}.shop{width:min(100%,390px)}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><h1>壁に沿う、4方向の扉</h1><p>木のガラス・セージ・アーチ。正面と背面、縦・横の壁に合わせた12枚です。入口の敷居を壁の位置に合わせ、通り抜ける部分は透明に保っています。</p><p><a href="../../../../">ゲーム</a> · <a href="../README.md">制作と検証</a></p><main></main><h2>ゲーム内の入口</h2><img class="shop" src="shop-timber.png" alt="木の扉をゲームの入口へ配置"><script src="../../../../assets/doors/geometry.js?v=1"></script><script src="../../../../door-art.js?v=1"></script><script>
BakeryDoorArt.ready(()=>{for(const [style,name]of [['timber','木のガラス扉'],['sage','セージの扉'],['arch','アーチの扉']]){const h=document.createElement('h2');h.textContent=name;document.querySelector('main').append(h);const grid=document.createElement('div');grid.className='grid';document.querySelector('main').append(grid);for(let dir=0;dir<4;dir++){const f=document.createElement('figure'),c=document.createElement('canvas');c.width=280;c.height=250;const ctx=c.getContext('2d'),axis=dir%2?'x':'y',p=(x,y)=>({x:(axis==='y'?95:180)+(x-y)*44,y:180+(x+y)*23.76});BakeryDoorArt.draw(ctx,p,{axis,x:0,y:0},44,{style,dir,width:1.5,height:3.15});f.append(c);const cap=document.createElement('figcaption');cap.textContent=['正面・横の壁','正面・縦の壁','背面・横の壁','背面・縦の壁'][dir];f.append(cap);grid.append(f)}}});
</script></html>
