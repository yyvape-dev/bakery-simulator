<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>動物のお客さん8種類</title><style>body{font:16px/1.7 system-ui;background:#f4ead6;color:#513f2e;max-width:1150px;margin:auto;padding:24px}h1{font:700 27px serif}a{color:#496a4d}nav,.controls{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}button,select{font:inherit;padding:7px 14px;border:1px solid #bea477;border-radius:10px;background:#fdf1d7;color:inherit}#cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff6e5 url('../../../../assets/ui/paper.webp') center/320px;border:4px solid #c6aa7b;border-radius:16px;text-align:center;overflow:hidden}.card h2{font-size:16px;margin:0 4px 12px}canvas{display:block;width:100%;height:auto}img{width:100%;border-radius:12px}small{font-size:12px}@media(max-width:700px){#cards{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><h1>パン屋に来る、8種類の動物たち</h1><p>二足歩行の小さな動物客。油彩・絵本の質感で、4方向と3コマの歩行をそろえました。</p><nav><a href="../../../../">ゲームを開く</a><a href="../README.md">制作と検証</a></nav><div class="controls"><select id="direction" aria-label="向き"><option value="0">手前・左向き</option><option value="1">手前・右向き</option><option value="2">奥・右向き</option><option value="3">奥・左向き</option></select><button id="animate" aria-pressed="false">歩行を見る</button></div><section id="cards"></section><p><small>鳥2色、猫3色、うさぎ2色は同じ基本デザインから毛色・羽色を変更。ゲーム中は8種類が順に来店します。</small></p><img src="trading.png" alt="ゲーム内で動物のお客さんが買い物をする様子"><script>const items=[['rabbit','うさぎ'],['rabbit-black','黒うさぎ'],['bird-purple','暗い紫の鳥'],['bird-white','白い鳥'],['cat-tabby','茶とら猫'],['cat-white','白猫'],['cat-black','黒猫'],['deer','シカ']],cards=[];let playing=false;for(const[id,name]of items){const node=document.createElement('article');node.className='card';const c=document.createElement('canvas');c.width=256;c.height=236;c.setAttribute('aria-label',name);const h=document.createElement('h2');h.textContent=name;node.append(c,h);document.querySelector('#cards').append(node);const im=new Image();im.onload=()=>paint();im.src='../../../../assets/customers/'+id+'.webp';cards.push({c,im})}function paint(){const dir=Number(document.querySelector('#direction').value),frame=playing?[0,1,2,1][Math.floor(performance.now()/240)%4]:1;for(const{c,im}of cards){if(!im.complete||!im.naturalWidth)continue;const x=c.getContext('2d');x.clearRect(0,0,256,236);x.drawImage(im,frame*256,dir*256,256,256,128-128*1.3,210-200*1.3,256*1.3,256*1.3)}}document.querySelector('#direction').onchange=paint;document.querySelector('#animate').onclick=e=>{playing=!playing;e.currentTarget.textContent=playing?'立ち姿を見る':'歩行を見る';e.currentTarget.setAttribute('aria-pressed',String(playing));paint()};setInterval(()=>{if(playing&&!document.hidden)paint()},80);</script></html>
