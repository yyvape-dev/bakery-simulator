<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>床で切れない木と増築｜こもれびベーカリー</title><style>body{font:16px/1.8 system-ui;background:#fff1d9;color:#684728;max-width:1100px;margin:auto;padding:24px}h1{font-size:26px}a{color:#39804f}.pair{display:flex;flex-wrap:wrap;gap:24px}figure{margin:0;flex:1;min-width:260px;max-width:390px}img{width:100%;border-radius:14px}figcaption{margin:10px 0}section{margin:28px 0}</style><h1>木は丸ごと、増築する場所から取り除く</h1><p>木を地面から独立したパーツにし、床で切れないようにしました。増築する範囲にかかる木はなくなり、残る木は同じ敷地位置に留まります。</p><p><a href="../../../../">ゲーム</a> · <a href="../README.md">仕様と検証</a></p><section class="pair"><figure><figcaption>変更前</figcaption><img src="before.png" alt="床に樹冠が切られていた木"></figure><figure><figcaption>変更後・12×12（8本）</figcaption><img src="after.png" alt="木が床より後に描かれる初期店舗"></figure></section><section class="pair"><figure><figcaption>横へ増築・14×12（6本）</figcaption><img src="shop-14x12.png" alt="横の増築範囲の木を除去"></figure><figure><figcaption>横へ増築・16×12（6本）</figcaption><img src="shop-16x12.png" alt="残る木は外へ移動しない"></figure></section><section class="pair"><figure><figcaption>奥へ増築・16×14（5本）</figcaption><img src="shop-16x14.png" alt="奥の建築範囲の木を除去"></figure><figure><figcaption>最大まで増築・16×16（4本）</figcaption><img src="shop-16x16.png" alt="残る木は同じ敷地位置に立つ"></figure></section></html>
